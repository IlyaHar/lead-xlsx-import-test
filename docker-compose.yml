services:
  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-lead_import}
      DB_USERNAME: ${MYSQL_USER:-lead_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-lead_password}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    command: --innodb-flush-log-at-trx-commit=2 --sync-binlog=0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lead_import}
      MYSQL_USER: ${MYSQL_USER:-lead_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lead_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql_data:

